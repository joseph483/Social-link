<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Frontend Mentor | Social links profile</title>
</head>

<body>
  <div class="container">
    <img class="Image-profile" src="assets/images/avatar-jessica.jpeg" alt="image">
    
    <div class="id">
      <h1>Jessica Randall</h1>
      <h2>London, United Kingdom</h2>
    </div>

    <p>
      "Front-end developer and avid reader."
    </p>

    <div class="links">
      <a class="button">GitHub</a>
      <a class="button">Frontend Mentor</a>
      <a class="button">LinkedIn</a>
      <a class="button">Twitter</a>
      <a class="button">Instagram</a>
    </div>
  
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Joseph Ernesto</a>.
  </footer>
</body>

</html>
